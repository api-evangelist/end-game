security_txt:
  served: false
  note: >-
    No RFC 9116 security.txt on any host, although Endgame does publish a
    Vulnerability Disclosure Policy at https://docs.endgame.io/vdp with a
    security@endgame.io contact (see security/end-game-vulnerability-disclosure.yml).
    Publishing the same contact at /.well-known/security.txt would make it
    machine-discoverable.
