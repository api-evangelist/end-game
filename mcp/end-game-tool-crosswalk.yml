summary: >-
  Endgame's MCP surface and its REST surface do not overlap at all. MCP exposes the
  context graph — searching entities, finding people, listing accounts — while the
  public REST API exposes only thread CRUD, the conversational wrapper around that
  graph. Not one documented MCP tool is backed by a public REST operation, and not one
  REST operation has a corresponding tool. An agent that can only speak REST cannot
  query the graph; it can only ask a question in natural language and poll for the
  answer. That is the single most important integration fact about this provider.
