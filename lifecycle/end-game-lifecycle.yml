spec_drift:
  observed: '2026-08-13'
  note: >-
    Two OpenAPI documents describe the same API and disagree. The documented
    reference (openapi/end-game-threads-api-openapi.yml) names five thread operations
    with camelCase operationIds and full schemas. The spec actually served at
    https://app.endgame.io/api/v1/openapi.json
    (openapi/_original/end-game-public-api-served-openapi.json, OpenAPI 3.1.1) names
    twelve operations with dotted operationIds, carries no components.schemas, no
    tags, and only 200 responses — and its paths omit the /api/v1 prefix that the
    same server requires, so a client generated from the served spec against
    servers[0] would call /threads and miss.
  divergences:
  - documented-but-thin: served spec has no schemas, tags or error responses
  - served-but-undocumented: protectedStatic.list/put/delete/getContent
  - served-but-internal: internal.feedback.list/promote/dismiss
  - path-prefix: served paths omit /api/v1 while servers[] is https://app.endgame.io
