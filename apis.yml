aid: end-game
name: Endgame
description: >-
  Endgame (Endgame Labs, Inc.) is a context graph platform for go-to-market teams
  and AI agents that turns sales calls, CRM records, emails, Slack conversations,
  meeting transcripts, and uploaded documents into structured, queryable revenue
  intelligence. Sales and RevOps users ask questions across their book of business
  in natural language, and connected AI assistants reach the same knowledge through
  the Endgame MCP Server. The public REST API (rooted at /api/v1) lets developers
  create and manage Endgame threads programmatically over HTTPS with Bearer-token
  authentication, while a broad connector surface ingests context from Salesforce,
  Gong, Chorus, Clari Copilot, Zoom, Notion, Confluence, Highspot, Seismic,
  Snowflake, Slack, Microsoft Teams/SharePoint/Outlook, and Google Drive. Endgame
  was surfaced through the API Evangelist VC-portfolio pipeline and has been
  enriched from its published developer documentation, OpenAPI, MCP server, and
  trust/security programs.
