apis:
- aid: end-game:end-game-threads-api
  name: Endgame Threads API
  description: >-
    The public Threads API from Endgame — 5 operations (create, get, list, rename,
    delete) rooted at /api/v1 on https://app.endgame.io, authenticated with a Bearer
    eak_ API key or a WorkOS M2M access token. Threads are the conversational unit
    behind Endgame Chat: POST a natural-language prompt, then poll the thread until
    the assistant's asynchronous response reaches status.state idle or error.
  humanURL: https://docs.endgame.io/api-reference/introduction
