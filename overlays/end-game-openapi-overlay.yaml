overlay: 1.0.0
info:
  title: API Evangelist enhancements for Endgame Public API
  version: 1.0.0
extends: openapi/end-game-openapi.json
actions:
- target: $.info
  update:
    x-apievangelist-provider: end-game
    x-apievangelist-artifacts:
      authentication: authentication/end-game-authentication.yml
      errors: errors/end-game-error-codes.yml
      conventions: conventions/end-game-conventions.yml
      data-model: data-model/end-game-data-model.yml
      rate-limits: rate-limits/end-game-rate-limits.yml
      mcp: mcp/end-game-mcp.yml
      lifecycle: lifecycle/end-game-lifecycle.yml
- target: $.info
  update:
    x-apievangelist-pagination: cursor
    x-apievangelist-error-envelope: 'custom { error: { code, message, trace_id } }'
    x-apievangelist-idempotency: not-supported
- target: $.paths['/api/v1/threads']['post']
  update:
    x-apievangelist-async: Poll getThread until status.state is idle or error.
